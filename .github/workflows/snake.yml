name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0B0B0C&color_dots=#ebedf0,#d9f99d,#bef264,#a3e635,#65a30d
            dist/snake-dark.svg?color_snake=#C6FF3D&color_dots=#161618,#2b3a10,#4d6b17,#86b625,#C6FF3D&color_background=#0B0B0C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
