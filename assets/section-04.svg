<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84">
<style>
@font-face{font-family:'U';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'M';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.u{font-family:'U','Arial Black',sans-serif;font-weight:800;}
.m{font-family:'M',ui-monospace,Consolas,monospace;font-weight:500;letter-spacing:.14em;}

.ln{transform:scaleX(0);transform-origin:0 0;animation:g 1.4s .2s cubic-bezier(.6,0,.2,1) forwards;}
@keyframes g{to{transform:scaleX(1)}}
</style>
<text class="m" x="0" y="38" font-size="24" fill="#C6FF3D">(04)</text>
<text class="m" x="84" y="38" font-size="24" fill="#F1EDE4">ACTIVITY</text>
<rect class="ln" x="0" y="66" width="1200" height="1" fill="#F1EDE4" opacity=".25"/>
</svg>